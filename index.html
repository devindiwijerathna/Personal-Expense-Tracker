<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1>Personal Expense Tracker</h1>
    </nav>

    <div class="container">
        <!-- Dashboard Header -->
        <div class="dashboard-header">
            <h2>Financial Dashboard</h2>
            <p>Manage your income and expenses in one place.</p>
        </div>

        <!-- Dashboard Summary Cards -->
        <section class="dashboard">
            <div class="card">
                <h3>Total Income</h3>
                <p id="total-income">LKR 0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="total-expenses">LKR 0.00</p>
            </div>
            <div class="card">
                <h3>Current Balance</h3>
                <p id="current-balance">LKR 0.00</p>
            </div>
        </section>

        <!-- Transaction Form -->
        <section class="form-section">
            <h2>Add a Transaction</h2>
            <form id="transaction-form">
                <div class="form-grid">
                    <div class="form-control">
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g., Monthly allowance" required>
                    </div>
                    <div class="form-control">
                        <label for="amount">Amount (LKR)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="Enter amount" required>
                    </div>
                    <div class="form-control">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Allowance">Allowance</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label for="date">Transaction Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="btn-container">
                    <button type="submit" id="add-btn">Add Transaction</button>
                    <button type="button" id="clear-btn">Clear Form</button>
                </div>
            </form>
        </section>

        <!-- Transaction History & Filters -->
        <section class="history-section">
            <h2>Transaction History</h2>
            <div class="filters">
                <div class="filter-control">
                    <label for="filter-type">Filter by Type</label>
                    <select id="filter-type">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expenses Only</option>
                    </select>
                </div>
                <div class="filter-control">
                    <label for="search-input">Search Transactions</label>
                    <input type="text" id="search-input" placeholder="Search by description or category...">
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Amount (LKR)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list">
                        <!-- Dynamic rows will be inserted here -->
                    </tbody>
                </table>
                <p id="no-data" class="no-data">No transactions found.</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
